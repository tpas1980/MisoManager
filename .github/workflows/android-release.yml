name: Android APK

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build installable Android APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean assembleDebug 2>&1 | tee gradle-build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          if [ -f gradle-build.log ]; then
            tail -n 100 gradle-build.log >> "$GITHUB_STEP_SUMMARY"
            grep -E '(^e: |error:|FAILURE:|Execution failed for task|What went wrong:|Could not resolve|Could not find)' gradle-build.log | tail -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MisoManager-Android-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MisoManager ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            Installable Android preview build of MisoManager. This APK is signed with the standard Android debug key and is intended for testing. A production Play Store release requires a private release-signing key.

  legacy-api24-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android test platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run sort and theme smoke test on Android 7.0
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 24
          target: default
          arch: x86
          profile: Nexus 5
          disable-animations: true
          script: |
            bash -c 'set -o pipefail; ./gradlew --no-daemon connectedDebugAndroidTest 2>&1 | tee api24-test.log; result=$?; adb logcat -d -s AndroidRuntime:E > api24-logcat.txt; exit $result'

      - name: Report API 24 test failure
        if: failure()
        shell: bash
        run: |
          for file in api24-test.log api24-logcat.txt; do
            if [ -f "$file" ]; then
              echo "### $file" >> "$GITHUB_STEP_SUMMARY"
              grep -A50 -B10 -E '(InflateException|FAILED|Failure|Exception|error:|FAILURE:|No tests found|AssertionError|Caused by:)' "$file" | tail -n 150 >> "$GITHUB_STEP_SUMMARY" || true
              grep -A50 -B10 -E '(InflateException|AssertionError)' "$file" | while IFS= read -r line; do
                echo "::error::$line"
              done
              grep -E '(FAILED|Failure|Exception|error:|FAILURE:|No tests found|AssertionError|Caused by:| at com\\.miso)' "$file" | tail -n 60 | while IFS= read -r line; do
                echo "::error::$line"
              done
            fi
          done
          python3 - <<'PY' > api24-test-failures.txt
          import glob
          import xml.etree.ElementTree as ET
          for path in glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True):
              print(f'### Test result: {path}')
              try:
                  root = ET.parse(path).getroot()
                  for node in root.iter('failure'):
                      print(node.attrib)
                      print(node.text or '')
              except Exception as error:
                  print(error)
          PY
          if [ -s api24-test-failures.txt ]; then
            cat api24-test-failures.txt >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do echo "::error::$line"; done < api24-test-failures.txt
          fi

      - name: Upload API 24 failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api24-smoke-failure-logs
          path: |
            api24-test.log
            api24-logcat.txt
            api24-test-failures.txt
            app/build/outputs/androidTest-results/connected
            app/build/reports/androidTests/connected
          if-no-files-found: ignore
